name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci-run-id: ${{ steps.ci.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Find verified CI assets for this commit
        id: ci
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return await require('./scripts/find-verified-ci.cjs')({ github, repo: context.repo, sha: context.sha });

  verify:
    needs: version
    if: needs.version.outputs.ci-run-id == ''
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified assets
    needs: [version, verify]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.verify.result == 'success' ||
       (needs.verify.result == 'skipped' && needs.version.outputs.ci-run-id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: claudian-collab-${{ github.sha }}
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ needs.version.outputs.ci-run-id || github.run_id }}
      - name: Validate downloaded assets
        run: node scripts/check-release.mjs "$RELEASE_TAG" release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            --title "$RELEASE_TAG" \
            release-assets/main.js release-assets/manifest.json release-assets/styles.css
          gh release edit "$RELEASE_TAG" --draft=false
