name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: node scripts/check-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: claudian-collab-${{ github.sha }}
          path: release-assets
      - name: Validate downloaded assets
        run: node scripts/check-release.mjs "$RELEASE_TAG" release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
            --title "$RELEASE_TAG" \
            release-assets/main.js release-assets/manifest.json release-assets/styles.css
          gh release edit "$RELEASE_TAG" --draft=false
