name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Lint, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:build
      - uses: actions/upload-artifact@v4
        with:
          name: claudian-collab-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            main.js
            manifest.json
            styles.css

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          test-cache: tests-${{ matrix.shard }}
      - run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=2 --cacheDirectory=.context/jest-cache --json --outputFile=test-results/jest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shard-count }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        shard: [1, 2]
        include:
          - os: macos-latest
            shard-count: 2
            build-shard: 1
          - os: windows-latest
            shard-count: 3
            build-shard: 2
          - os: windows-latest
            shard: 3
            shard-count: 3
            build-shard: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          test-cache: native-${{ matrix.shard }}
      - run: npm run test:cross-platform -- --shard=${{ matrix.shard }}/${{ matrix.shard-count }} --maxWorkers=2 --cacheDirectory=.context/jest-cache --json --outputFile=test-results/jest.json
      - run: npm run build
        if: matrix.shard == matrix.build-shard
      - run: npm run test:build
        if: matrix.shard == matrix.build-shard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  lan:
    name: Published LAN compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mkdir -p test-results
      - run: npm run test:lan-compatibility -- --json --outputFile=test-results/lan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lan-compatibility
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [quality, tests, native, lan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); if (results.some(result => result !== "success")) { console.error(results); process.exit(1); }'
