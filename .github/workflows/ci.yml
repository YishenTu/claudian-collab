name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - if: runner.os == 'Linux'
        run: npm test
      - if: runner.os != 'Linux'
        run: npm run test:cross-platform
      - run: npm run build
      - run: npm run test:build
      - if: runner.os == 'Linux'
        run: npm run test:lan-compatibility
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: claudian-collab
          path: |
            main.js
            manifest.json
            styles.css
