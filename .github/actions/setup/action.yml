name: Set up CI dependencies
description: Install the pinned Node version and dependencies, with optional Jest transform caching.
inputs:
  test-cache:
    description: Separate cache namespace for each test suite and shard.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
    - run: npm ci --prefer-offline --no-audit --no-fund
      shell: bash
    - uses: actions/cache@v4
      if: inputs.test-cache != ''
      with:
        path: .context/jest-cache
        key: jest-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.test-cache }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig*.json', 'jest*.js', 'jest*.cjs') }}-${{ github.sha }}
        restore-keys: |
          jest-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.test-cache }}-${{ hashFiles('.node-version', 'package-lock.json', 'tsconfig*.json', 'jest*.js', 'jest*.cjs') }}-
